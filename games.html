<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fred's Games</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="page">

    <marquee scrollamount="4">
        ★ GAME ZONE ★
    </marquee>

    <h1>GAME ZONE</h1>

    <nav>
        <a href="index.html">home</a> |
        <a href="guides.html">guides</a> |
        <a href="games.html">games</a> |
        <a href="links.html">links</a> |
        <a href="music.html">music</a>
    </nav>


    <div class="game">

        <h2>Guess the Number</h2>

        <p>
            I'm thinking of a number between 1 and 100.
        </p>

        <input id="guess" type="number">

        <button onclick="checkGuess()">
            Guess
        </button>

        <p id="guessResult">
            Good luck.
        </p>

    </div>


    <div class="game">

        <h2>Pointless Clicker</h2>

        <p>
            Click this 100 times.
            There is absolutely no reason to do this.
        </p>

        <button onclick="clickCount()">
            CLICK
        </button>

        <p>
            Clicks:
            <span id="clicks">0</span>
        </p>

        <p id="secretMessage"></p>

    </div>


    <div class="game">

        <h2>Reaction Test</h2>

        <p id="reactionText">
            Press Start.
        </p>

        <div id="reactionBox" onclick="reactionClick()">
            WAIT...
        </div>

        <button onclick="startReaction()">
            Start
        </button>

    </div>

</div>


<script>

let clickTotal = 0;

function clickCount() {

    clickTotal++;

    document.getElementById("clicks").textContent = clickTotal;

    if (clickTotal === 50) {
        document.getElementById("secretMessage").textContent =
            "Halfway there. Why are you doing this?";
    }

    if (clickTotal === 75) {
        document.getElementById("secretMessage").textContent =
            "Seriously?";
    }

    if (clickTotal >= 100) {
        document.getElementById("secretMessage").innerHTML =
            'You found something! <a href="secret.html">GO HERE.</a>';
    }
}


let secretNumber =
    Math.floor(Math.random() * 100) + 1;

function checkGuess() {

    const guess =
        Number(document.getElementById("guess").value);

    const result =
        document.getElementById("guessResult");

    if (guess === secretNumber) {

        result.textContent = "🎉 Correct!";

        secretNumber =
            Math.floor(Math.random() * 100) + 1;

    } else if (guess < secretNumber) {

        result.textContent = "Too low.";

    } else {

        result.textContent = "Too high.";
    }
}


let reactionReady = false;
let reactionStart = 0;

function startReaction() {

    const box =
        document.getElementById("reactionBox");

    const text =
        document.getElementById("reactionText");

    reactionReady = false;

    box.textContent = "WAIT...";
    text.textContent = "Wait...";

    setTimeout(function () {

        reactionReady = true;
        reactionStart = Date.now();

        box.textContent = "CLICK NOW!";
        text.textContent = "GO!";

    }, Math.floor(Math.random() * 3000) + 1500);
}


function reactionClick() {

    const box =
        document.getElementById("reactionBox");

    const text =
        document.getElementById("reactionText");

    if (!reactionReady) {

        box.textContent = "Too early!";
        text.textContent = "You jumped the gun.";

        return;
    }

    const time =
        Date.now() - reactionStart;

    box.textContent = time + " ms";
    text.textContent = "Nice reaction!";

    reactionReady = false;
}

</script>

</body>
</html>
